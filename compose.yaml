name: qwen38-local

services:
  webui:
    image: ghcr.io/open-webui/open-webui@sha256:e78f8d3672b1f32867cedc90a3f3b31ee53a7b5cf027618c944be88bae9d67f4
    platform: linux/arm64
    container_name: qwen38-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT:-2501}:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_OPENAI_API_PASSTHROUGH: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      OPENAI_API_BASE_URL: "http://host.containers.internal:8001/v1"
      OPENAI_API_KEY: "${LOCAL_QWEN_API_KEY:?LOCAL_QWEN_API_KEY must be set}"
      TASK_MODEL_EXTERNAL: "qwen3.8-27b-local"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}"
      WEBUI_AUTH: "true"
      WEBUI_NAME: "Qwen3.8 Local"
      WEBUI_URL: "http://localhost:${WEBUI_PORT:-2501}"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "120"
    volumes:
      - webui-data:/app/backend/data

volumes:
  webui-data:
